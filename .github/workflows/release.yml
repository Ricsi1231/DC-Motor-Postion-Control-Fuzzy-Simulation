name: Release

# Every merge to main cuts a release.
#
#   1. `version` classifies the commits since the last tag (Conventional
#      Commits: feat -> minor, feat!/BREAKING CHANGE -> major, anything else
#      -> patch), rewrites version.txt, commits it back to main, and tags
#      v<version>.
#   2. `ci` runs the full lint/type/test matrix.
#   3. The remaining jobs build and publish that tag.
#
# The bump commit carries [skip ci], so it does not re-trigger this workflow.
# A tag can also be pushed by hand, which skips step 1 and publishes it as is.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Bump version and tag
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit version.txt and push the tag
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      level: ${{ steps.bump.outputs.level }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the bump is computed from commit history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute and apply the bump
        id: bump
        run: |
          set -euo pipefail
          PREVIOUS="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          echo "Previous tag: ${PREVIOUS:-<none>}"

          python scripts/bump_version.py \
            --since "$PREVIOUS" --write --format github >> "$GITHUB_OUTPUT"

          cat "$GITHUB_OUTPUT"

      - name: Fail if the tag already exists
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.bump.outputs.tag }}" >/dev/null; then
            echo "::error::Tag ${{ steps.bump.outputs.tag }} already exists"
            exit 1
          fi

      - name: Commit and tag
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add version.txt
          git commit -m "chore(release): ${{ steps.bump.outputs.tag }} [skip ci]"
          git tag -a "${{ steps.bump.outputs.tag }}" \
                  -m "Release ${{ steps.bump.outputs.tag }}"

          git push origin HEAD:main
          git push origin "${{ steps.bump.outputs.tag }}"

  ci:
    name: CI
    needs: [version]
    # Also run for a hand-pushed tag, where the version job is skipped.
    if: always() && !cancelled() && (needs.version.result == 'success' || github.ref_type == 'tag')
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and verify
    needs: [version, ci]
    if: always() && !cancelled() && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the tag just created, or the tag that triggered the run.
          ref: ${{ needs.version.outputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build
        run: |
          python -m pip install build twine
          python -m build

      - name: Check metadata
        run: python -m twine check --strict dist/*

      - name: Verify the built version matches version.txt and the tag
        id: version
        env:
          EXPECTED_TAG: ${{ needs.version.outputs.tag || github.ref_name }}
        run: |
          python -m pip install packaging
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, pathlib
          from packaging.utils import parse_wheel_filename
          from packaging.version import Version

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          _, built, _, _ = parse_wheel_filename(wheel.name)

          declared = Version(pathlib.Path("version.txt").read_text().strip())
          if built != declared:
              raise SystemExit(f"::error::Wheel is {built} but version.txt says {declared}")

          expected = os.environ["EXPECTED_TAG"]
          if expected.startswith("v") and Version(expected[1:]) != built:
              raise SystemExit(f"::error::Tag {expected} does not match built version {built}")

          print(f"version={built}")
          print(f"tag=v{built}")
          print(f"prerelease={str(built.is_prerelease or built.is_devrelease).lower()}")
          PY
          cat "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: needs.build.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/dc-motor-fuzzy-sim
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: Publish to PyPI
    needs: build
    if: >-
      needs.build.outputs.prerelease == 'false' &&
      github.repository == 'Ricsi1231/DC-Motor-Postion-Control-Fuzzy-Simulation'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dc-motor-fuzzy-sim
    permissions:
      id-token: write # Trusted Publishing: no API token secret needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Publish GitHub Release
    needs: [build, pypi]
    if: always() && !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the artifacts
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          body: |
            ## Install

            ```bash
            pip install dc-motor-fuzzy-sim==${{ needs.build.outputs.version }}
            ```

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
            for the full list of changes.
